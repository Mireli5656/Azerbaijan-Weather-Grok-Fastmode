<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azərbaycanın Bütün Rayonları - Detallı Hava Durumu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
  }
  h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle { color: #94a3b8; font-size: 1.05rem; }
  .search-box {
    max-width: 500px;
    margin: 20px auto;
  }
  #search {
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #1e293b;
    color: white;
    font-size: 1rem;
    outline: none;
  }
  #search:focus { border-color: #38bdf8; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #38bdf8;
    box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
  }
  .card h3 { font-size: 1.2rem; margin-bottom: 4px; color: #f1f5f9; }
  .card .region { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
  .weather-preview {
    font-size: 0.95rem;
    color: #cbd5e1;
    min-height: 60px;
  }
  .temp { font-size: 1.6rem; font-weight: 700; color: #38bdf8; }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: #1e293b;
    border-radius: 20px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
    position: relative;
    border: 1px solid #334155;
  }
  .close {
    position: absolute;
    top: 16px; right: 20px;
    font-size: 1.6rem;
    cursor: pointer;
    color: #94a3b8;
  }
  .close:hover { color: white; }
  .detail-temp { font-size: 3.2rem; font-weight: 800; color: #38bdf8; }
  .condition { font-size: 1.3rem; margin: 8px 0; }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
  }
  .info-item {
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
  }
  .info-item span { display: block; color: #94a3b8; font-size: 0.8rem; }
  .forecast {
    margin-top: 15px;
  }
  .forecast-day {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #334155;
  }
  .loading { color: #94a3b8; font-style: italic; }
  footer {
    text-align: center;
    margin-top: 40px;
    color: #64748b;
    font-size: 0.85rem;
  }
  @media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Azərbaycanın Bütün Rayonları</h1>
  <p class="subtitle">Detallı Canlı Hava Durumu • Open-Meteo API ilə</p>
  <div class="search-box">
    <input type="text" id="search" placeholder="Rayon axtar (məs: İmişli, Bakı, Quba...)">
  </div>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" id="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<footer>
  Məlumatlar Open-Meteo-dan gəlir. Koordinatlar təxmini mərkəz nöqtələridir.<br>
  Son yenilənmə: canlı sorğu ilə
</footer>

  { name: "Babək", region: "Naxçıvan", lat: 39.15, lon: 45.45 },
  { name: "Culfa", region: "Naxçıvan", lat: 38.96, lon: 45.63 },
  { name: "Ordubad", region: "Naxçıvan", lat: 38.91, lon: 46.03 }
];

const weatherCodes = {
  0: "Açıq səma",
  1: "Əsasən açıq",
  2: "Qismən buludlu",
  3: "Buludlu",
  45: "Duman",
  48: "Buzlu duman",
  51: "Yüngül çiskin",
  53: "Orta çiskin",
  55: "Güclü çiskin",
  61: "Yüngül yağış",
  63: "Orta yağış",
  65: "Güclü yağış",
  71: "Yüngül qar",
  73: "Orta qar",
  75: "Güclü qar",
  80: "Yüngül leysan",
  81: "Orta leysan",
  82: "Güclü leysan",
  95: "Tufan",
  96: "Dolu ilə tufan",
  99: "Güclü dolu ilə tufan"
};

function getWeatherDesc(code) {
  return weatherCodes[code] || "Naməlum";
}

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modal-body');
const closeBtn = document.getElementById('close');

function renderCards(list) {
  grid.innerHTML = '';
  list.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${d.name}</h3>
      <div class="region">${d.region}</div>
      <div class="weather-preview" id="preview-${d.name.replace(/\s/g,'')}">
        <span class="loading">Yüklənir...</span>
      </div>
    `;
    card.onclick = () => openDetail(d);
    grid.appendChild(card);
    loadPreview(d);
  });
}

async function loadPreview(d) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${d.lat}&longitude=${d.lon}&current=temperature_2m,weather_code,relative_humidity_2m&timezone=Asia/Baku`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    const el = document.getElementById(`preview-${d.name.replace(/\s/g,'')}`);
    if (el && c) {
      el.innerHTML = `
        <div class="temp">${Math.round(c.temperature_2m)}°C</div>
        <div>${getWeatherDesc(c.weather_code)}</div>
        <div>Rütubət: ${c.relative_humidity_2m}%</div>
      `;
    }
  } catch (e) {
    const el = document.getElementById(`preview-${d.name.replace(/\s/g,'')}`);
    if (el) el.innerHTML = '<span>Xəta</span>';
  }
}

async function openDetail(d) {
  modal.classList.add('active');
  modalBody.innerHTML = `<h2>${d.name}</h2><p class="loading">Detallı məlumat yüklənir...</p>`;

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${d.lat}&longitude=${d.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&timezone=Asia/Baku&forecast_days=4`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    const daily = data.daily;

    let forecastHtml = '';
    if (daily && daily.time) {
      forecastHtml = '<div class="forecast"><h3>Növbəti günlər</h3>';
      for (let i = 0; i < Math.min(3, daily.time.length); i++) {
        const date = new Date(daily.time[i]).toLocaleDateString('az-AZ', { weekday: 'short', day: 'numeric', month: 'short' });
        forecastHtml += `
          <div class="forecast-day">
            <span>${date}</span>
            <span>${Math.round(daily.temperature_2m_min[i])}° / ${Math.round(daily.temperature_2m_max[i])}°</span>
            <span>${getWeatherDesc(daily.weather_code[i])}</span>
          </div>`;
      }
      forecastHtml += '</div>';
    }

    modalBody.innerHTML = `
      <h2>${d.name} <small style="color:#94a3b8;font-size:0.9rem">(${d.region})</small></h2>
      <div class="detail-temp">${Math.round(c.temperature_2m)}°C</div>
      <div class="condition">${getWeatherDesc(c.weather_code)}</div>
      <div class="info-grid">
        <div class="info-item"><span>Hiss edilən</span><strong>${Math.round(c.apparent_temperature)}°C</strong></div>
        <div class="info-item"><span>Rütubət</span><strong>${c.relative_humidity_2m}%</strong></div>
        <div class="info-item"><span>Külək</span><strong>${c.wind_speed_10m} km/s</strong></div>
        <div class="info-item"><span>Yağıntı</span><strong>${c.precipitation || 0} mm</strong></div>
      </div>
      ${forecastHtml}
      <p style="margin-top:15px;font-size:0.8rem;color:#64748b">Koordinat: ${d.lat.toFixed(2)}, ${d.lon.toFixed(2)}</p>
    `;
  } catch (e) {
    modalBody.innerHTML = `<h2>${d.name}</h2><p>Məlumat alınmadı. İnterneti yoxlayın.</p>`;
  }
}

closeBtn.onclick = () => modal.classList.remove('active');
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

search.oninput = () => {
  const q = search.value.toLowerCase().trim();
  const filtered = districts.filter(d => 
    d.name.toLowerCase().includes(q) || d.region.toLowerCase().includes(q)
  );
  renderCards(filtered);
};

renderCards(districts);
</script>
</body>
</html>
